<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Us - Foodie</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {

            background: #f8f9fa;

            font-family: Arial, sans-serif;

        }


        .contact-section {

            max-width: 800px;

            margin: 70px auto;

            background: white;

            padding: 45px;

            border-radius: 18px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.08);

        }


        .contact-section h1 {

            text-align: center;

            font-weight: 700;

            margin-bottom: 15px;

        }


        .contact-section > p {

            text-align: center;

            color: #666;

            margin-bottom: 35px;

        }


        .contact-info {

            background: #fff3cd;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 25px;

        }


        .contact-info p {

            color: #666;

        }


        .btn-contact {

            background: #212529;

            color: white;

            width: 100%;

            padding: 12px;

            border-radius: 8px;

            border: none;

        }


        .btn-contact:hover {

            background: #000;

            color: white;

        }


        .success-message {

            background: #d1e7dd;

            color: #0f5132;

            padding: 14px;

            border-radius: 10px;

            text-align: center;

            font-weight: bold;

            margin-bottom: 25px;

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">


            <a
                class="navbar-brand fw-bold fs-4"
                href="{% url 'home' %}"
            >
                🍔 Foodie
            </a>


            <div>

                <a
                    class="text-decoration-none text-dark me-4"
                    href="{% url 'home' %}"
                >
                    Home
                </a>


                <a
                    class="text-decoration-none text-dark me-4"
                    href="{% url 'contact' %}"
                >
                    Contact Us
                </a>


                <a
                    class="text-decoration-none text-dark"
                    href="{% url 'cart' %}"
                >
                    🛒 Cart
                </a>

            </div>


        </div>

    </nav>



    <!-- =========================
         CONTACT SECTION
    ========================== -->

    <section class="contact-section">


        <h1>
            Contact Us 📞
        </h1>


        <p>
            Have any questions or suggestions?
            We would love to hear from you!
        </p>



        <!-- CONTACT INFORMATION -->

        <div class="contact-info">


            <h5>
                📍 Address
            </h5>

            <p class="text-start mb-3">
                Foodie Restaurant, Punjab, India
            </p>


            <h5>
                📧 Email
            </h5>

            <p class="text-start mb-3">
                foodie@example.com
            </p>


            <h5>
                📱 Phone
            </h5>

            <p class="text-start mb-0">
                +91 98765 43210
            </p>


        </div>



        <!-- =========================
             SUCCESS MESSAGE
        ========================== -->

        {% if success %}

            <div class="success-message">

                Message sent successfully! ✅

            </div>

        {% endif %}



        <!-- =========================
             CONTACT FORM
        ========================== -->

        <form
            method="POST"
            action="{% url 'contact' %}"
        >

            {% csrf_token %}


            <!-- NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Your Name
                </label>


                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required
                >

            </div>



            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Your Email
                </label>


                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <!-- MESSAGE -->

            <div class="mb-3">

                <label class="form-label">
                    Message
                </label>


                <textarea
                    name="message"
                    class="form-control"
                    rows="5"
                    placeholder="Write your message..."
                    required
                ></textarea>

            </div>



            <!-- SEND BUTTON -->

            <button
                type="submit"
                class="btn-contact"
            >

                Send Message

            </button>


        </form>


    </section>


</body>

</html>
