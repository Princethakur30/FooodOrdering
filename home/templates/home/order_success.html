<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Placed - Foodie</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .success-box {
            background: white;
            max-width: 650px;
            margin: 80px auto;
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .success-icon {
            font-size: 70px;
        }

        .success-title {
            font-weight: 800;
            margin-top: 15px;
        }

        .order-number {
            font-weight: 700;
            color: #198754;
            font-size: 20px;
        }

        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #ffc107;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="success-box">

        <div class="success-icon">
            🎉
        </div>

        <h1 class="success-title">
            Order Placed Successfully!
        </h1>

        <p class="text-muted">
            Thank you for ordering from Foodie.
        </p>

        <p>
            Your Order Number is:
        </p>

        <div class="order-number">

            #{{ order.id }}

        </div>

        <p class="mt-3">

            Total Amount:
            <strong>
                ₹{{ order.grand_total }}
            </strong>

        </p>

        <p>
            Payment:
            <strong>
                {{ order.get_payment_method_display }}
            </strong>
        </p>

        <a
            href="{% url 'home' %}"
            class="home-btn"
        >

            Continue Shopping 🍔

        </a>

    </div>

</div>

</body>

</html>
